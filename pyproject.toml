[project]
name = "filing-facts"
version = "0.1.0"
description = "GCP-native pipeline ingesting UK Companies House iXBRL accounts and evaluating LLM extraction against XBRL ground truth."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "structlog>=24.1",
    "google-cloud-storage>=2.17",
    "google-cloud-bigquery>=3.25",
    "lxml>=6.1.3",
    "google-genai>=2.22.0",
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.4",
    "google-cloud-pubsub>=2.40.0",
    "google-cloud-run>=0.16.1",
    "opentelemetry-sdk>=1.44.0",
    "opentelemetry-exporter-gcp-trace>=1.15.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "ruff>=0.5",
    "pyright>=1.1.370",
    "types-lxml>=2026.2.16",
    "dbt-bigquery>=1.12.0",
    "httpx>=0.28.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/filing_facts"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF", "PT", "ANN", "S"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S108"]
"airflow/tests/**" = ["S101"]
"scripts/**" = ["S101"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["src", "tests", "scripts"]
venvPath = "."
venv = ".venv"
reportMissingTypeStubs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
